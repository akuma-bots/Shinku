name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile bot, cogs, and utilities
        run: python -m compileall -q bot.py cogs utils
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify cogs expose setup()
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          errors = []
          for path in sorted(Path("cogs").glob("*.py")):
              if path.name == "__init__.py":
                  continue
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except SyntaxError as exc:
                  errors.append(f"{path}: syntax error: {exc}")
                  continue
              if not any(
                  isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == "setup"
                  for node in tree.body
              ):
                  errors.append(f"{path}: missing module-level setup()")
          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print("All cogs compile and expose setup().")
          PY
