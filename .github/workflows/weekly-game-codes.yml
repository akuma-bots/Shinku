name: Weekly game codes refresh

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-game-codes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh active codes from public sources
        run: python scripts/atualizar_codigos_jogos.py
      - name: Validate JSON catalog
        run: python -m json.tool config/codigos_jogos.json > /dev/null
      - name: Commit weekly catalog when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/codigos_jogos.json
          if git diff --cached --quiet; then
            echo "O catálogo não mudou; nenhum commit necessário."
          else
            git commit -m "chore: refresh weekly game codes"
            git push
          fi
